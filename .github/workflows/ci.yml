name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VPNSH_CI: "1"
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: |
          docker run --rm -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" \
            -f gcc -x -s bash \
            bin/vpnsh lib/*.sh tests/*.sh scripts/ssh-askpass scripts/update-pins \
            docker/work/entrypoint.sh docker/work/preflight.sh docker/work/diag.sh docker/work/bashrc

      - name: Perl syntax (SSH relay)
        run: |
          perl -c scripts/ssh-relay
          perl -c docker/work/ssh-relay

      - name: seccomp profile is valid JSON
        run: python3 -m json.tool templates/seccomp-work.json >/dev/null

      - name: compose.yaml is valid
        run: docker compose -f compose.yaml --env-file .env.example --profile work config --quiet

  macos-version:
    name: macos (macOS ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "15"
            runner: macos-15
          - version: "26"
            runner: macos-26
          - version: "27"
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the shell and tool versions
        run: |
          /bin/bash --version | head -n 1
          /usr/bin/perl -e 'print "perl $^V\n"'
          sw_vers

      - name: zsh completion syntax
        run: zsh -n completions/_vpnsh

      - name: Perl syntax with the macOS perl (SSH relay)
        run: /usr/bin/perl -c scripts/ssh-relay

      - name: Unit tests
        run: /bin/bash tests/unit-test.sh

      - name: Mount safety tests
        run: /bin/bash tests/mount-test.sh

      - name: SSH tests (without Docker)
        env:
          VPNSH_TEST_SKIP_DOCKER: "1"
        run: /bin/bash tests/ssh-test.sh

  # 必須のチェック (macos) として、すべての macOS のバージョンの結果をまとめる
  macos:
    needs: macos-version
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All macOS versions passed
        env:
          RESULT: ${{ needs.macos-version.result }}
        run: |
          echo "macos-version: $RESULT"
          [ "$RESULT" = "success" ]

  image-arch:
    name: image (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # vpnsh build と同じく、実行するユーザーの UID・GID でビルドする
      - name: Build the work image
        run: VPNSH_UID="$(id -u)" VPNSH_GID="$(id -g)" docker compose -f compose.yaml --env-file .env.example --profile work build work

      - name: Check the image is hardened
        run: tests/image-test.sh

      - name: Pull the pinned gluetun image
        run: docker compose -f compose.yaml --env-file .env.example pull gluetun

      - name: SSH tests (with Docker)
        env:
          VPNSH_CONTEXT: default
        run: /bin/bash tests/ssh-test.sh

      # gluetun の中で ip6tables-legacy を使えるように、ホストでカーネルモジュールを読み込む
      - name: Load the legacy ip6tables kernel modules
        run: sudo modprobe -a ip6_tables ip6table_filter

      - name: Firewall tests
        env:
          VPNSH_CONTEXT: default
        run: /bin/bash tests/firewall-test.sh

  # 必須のチェック (image) として、両方のアーキテクチャの結果をまとめる
  image:
    needs: image-arch
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All architectures passed
        env:
          RESULT: ${{ needs.image-arch.result }}
        run: |
          echo "image-arch: $RESULT"
          [ "$RESULT" = "success" ]
